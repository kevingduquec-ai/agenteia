services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: prefiero-ia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefiero
      POSTGRES_PASSWORD: prefiero
      POSTGRES_DB: prefiero_ia
    ports:
      # 5433 en el host: el 5432 ya esta ocupado por otro Postgres en esta maquina.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefiero -d prefiero_ia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prefiero-ia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
